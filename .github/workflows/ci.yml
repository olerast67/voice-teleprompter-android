# Builds the app and runs the unit tests on every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "fastlane/**", "site/**", ".github/ISSUE_TEMPLATE/**", ".github/workflows/pages.yml"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "fastlane/**", "site/**", ".github/ISSUE_TEMPLATE/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      # Validates the Gradle wrapper checksum; 'basic' keeps the cache fully open source.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      # The speech library and model (~80 MB) come from fetchSpeechAssets, which re-checks them against the pinned
      # SHA-256 on every build, so a cached copy cannot smuggle in a different file.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/libs/*.aar
            app/src/main/assets/asr-ru/*.onnx
            app/src/main/assets/asr-ru/tokens.txt
            app/src/main/assets/asr-ru/bpe.vocab
            app/src/main/assets/asr-en/*.onnx
            app/src/main/assets/asr-en/tokens.txt
            app/src/main/assets/asr-en/bpe.vocab
          key: speech-assets-${{ hashFiles('app/build.gradle.kts') }}

      # Lint fails on new problems only; those known when it was added are listed in app/lint-baseline.xml.
      - name: Build, test and lint
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug assembleLite testDebugUnitTest lintDebug

      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 7
